asyncapi: 3.1.0
info:
  title: WebSocket Demo
  version: '1.0.0'
  description: |
    Demo AsyncAPI 3.1 spec for a generic WebSocket API.
    This fixture exercises the multi-line description path used by the generated Cargo.toml.
defaultContentType: application/json
servers:
  production:
    host: ws.example.com
    protocol: ws
    pathname: /ws
    description: Production WebSocket endpoint.
channels:
  market:
    address: market
    messages:
      subscribe:
        $ref: '#/components/messages/subscribe'
      quote:
        $ref: '#/components/messages/quote'
      authResult:
        name: authResult
        title: AuthResult
        summary: Authentication result event.
        payload:
          type: object
          required:
            - status
          properties:
            status:
              type: string
      coreEvent:
        name: coreEvent
        title: CoreEvent
        summary: Core event payload.
        payload:
          type: object
          required:
            - event
          properties:
            event:
              type: string
components:
  messages:
    subscribe:
      name: subscribe
      title: Subscribe
      summary: Subscribe to a market feed.
      payload:
        type: object
        required:
          - name
          - instrument_id
        properties:
          name:
            type: string
            const: subscribe
          instrument_id:
            type: integer
            format: int64
    unsubscribe:
      name: unsubscribe
      title: Unsubscribe
      summary: Unsubscribe from a market feed.
      payload:
        type: object
        required:
          - name
          - instrument_id
        properties:
          name:
            type: string
            const: unsubscribe
          instrument_id:
            type: integer
            format: int64
    quote:
      name: quote
      title: Quote
      summary: Market quote update.
      payload:
        type: object
        required:
          - symbol
          - price
        properties:
          symbol:
            type: string
          price:
            type: number
          volume:
            type: integer
            format: int64
    AuthResult:
      name: AuthResult
      title: AuthResult
      summary: Authentication payload from the server.
      payload:
        type: object
        required:
          - user_id
          - status
        properties:
          user_id:
            type: integer
            format: int64
          status:
            type: string
    CoreEvent:
      name: CoreEvent
      title: CoreEvent
      summary: Core event payload from the server.
      payload:
        type: object
        required:
          - sequence
        properties:
          sequence:
            type: integer
            format: int64
    heartbeat:
      name: heartbeat
      title: Heartbeat
      summary: Server heartbeat.
      payload:
        type: object
        required:
          - timestamp
        properties:
          timestamp:
            type: integer
            format: int64
  operations:
    subscribeToMarket:
      action: send
      channel:
        $ref: '#/channels/market'
      messages:
        - $ref: '#/channels/market/messages/subscribe'
    receiveMarketQuote:
      action: receive
      channel:
        $ref: '#/channels/market'
      messages:
        - $ref: '#/channels/market/messages/quote'
